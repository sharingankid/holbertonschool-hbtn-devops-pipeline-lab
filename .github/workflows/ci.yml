# ---------------------------------------------------------------------------
# Continuous integration and delivery for hbtn-devops-pipeline-lab.
#
#   test   : every push and pull request to main. Lint, then the full Jest
#            suite against a Postgres service; the JUnit report is always kept.
#   build  : push to main only, after test. Publishes the runtime image to GHCR
#            as :<commit sha> (immutable) and :latest (moving).
#   deploy : push to main only, after build. Triggers the Render staging deploy
#            and fails unless /health and /items both answer 200.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the test suite with a JUnit report
        env:
          DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./reports/
          retention-days: 7

  build:
    name: Build and publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Trigger Render deploy
        id: trigger
        run: |
          response=$(curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          deploy_id=$(echo "$response" | jq -r '.id')
          echo "Render deploy ${deploy_id} created"
          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy to go live
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          max_attempts=40
          for attempt in $(seq 1 "$max_attempts"); do
            status=$(curl -fsS "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Attempt ${attempt}/${max_attempts}: deploy status is ${status}"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Deploy did not go live within ${max_attempts} attempts"
          exit 1

      - name: Verify /health and /items on staging
        run: |
          max_attempts=10
          for attempt in $(seq 1 "$max_attempts"); do
            health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${STAGING_URL}/health") || health=000
            items=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${STAGING_URL}/items") || items=000
            echo "Attempt ${attempt}/${max_attempts}: /health=${health} /items=${items}"
            if [ "$health" = "200" ] && [ "$items" = "200" ]; then
              echo "Staging is live and can query PostgreSQL"
              exit 0
            fi
            sleep 10
          done
          echo "Staging verification failed after ${max_attempts} attempts"
          exit 1
