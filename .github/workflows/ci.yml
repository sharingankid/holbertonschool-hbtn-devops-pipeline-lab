# ---------------------------------------------------------------------------
# Continuous integration and delivery for hbtn-devops-pipeline-lab.
#
#   test   : every push and pull request to main. Lint, then the full Jest
#            suite against a Postgres service; the JUnit report is always kept.
#   build  : push to main only, after test. Publishes the runtime image to GHCR
#            as :<commit sha> (immutable) and :latest (moving).
#   deploy : push to main only, after build. Triggers the Render staging deploy
#            and fails unless /health and /items both answer 200.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the test suite with a JUnit report
        env:
          DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./reports/
          retention-days: 7
